apiVersion: apps/v1
kind: Deployment
metadata:
  name: template-ui
  labels:
    app: chatbot
    component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chatbot
      component: ui
  template:
    metadata:
      labels:
        app: chatbot
        component: ui
    spec:
      containers:
        - name: template-ui
          image: image-registry.openshift-image-registry.svc:5000/chatbot/template-ui:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: template-ui-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              memory: "128Mi"
            limits:
              memory: "256Mi"
      restartPolicy: Always
